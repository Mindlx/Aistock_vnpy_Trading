# 融合系统配置文件
# ⚠️ 本系统仅供学习和研究目的，不构成任何投资建议

weights:
  lynx_vnpy: 0.36          # ly: RandomForest 量化模型 (T+1, 复杂模型)
  mindlynx: 0.48           # ml: 因子层实时模型 + LLM推理 (盘中实时, 12因子+策略)
  tradingagent: 0.10       # at: 多智能体辩论 — 28%准确率系统性反指，详见 docs/research/at-optimization-oracle-c1skill-review.md
  ml_factor: 0.06          # mf: 纯因子层信号 (12因子数学加权, 无LLM, 每5分钟更新)

# 7 级 L7 阈值已内置于 normalizer.py 的 L7_THRESHOLDS 中
# 如需自定义，取消注释并在 fusion_engine.py 中改为从 config 读取

# ═══════════════════════════════════════
# 融合模式（v2.0）
# ═══════════════════════════════════════
# linear:   线性加权 + 分歧检测（原始模式，向后兼容）
# bayesian: 可靠性调制贝叶斯融合（Oracle 架构）
# dual:     同时输出两种结果供 A/B 对比
fusion_mode: "dual"

# sentiment_score 方向映射阈值（2026-06-07 校准）
# bull: score >= 此值 → 看多
# bear: score <= 此值 → 看空
# score 在 (bear, bull) 之间 → flat（中性，额外降权 0.5）
# 52/49: 74.6% acc, 98% coverage (balanced 73.2)
# 60/40: 73.5% acc, 57% coverage (balanced 42.0)
sentiment_threshold:
  bull: 52
  bear: 49

reliability:
  # 各系统基础可靠度（由系统本质决定，非日常调优参数）
  base_alpha:
    lynx_vnpy: 0.75       # sklearn predict_proba，可回测，100%可重复
    mindlynx: 0.55        # ~40% 因子数学 + ~60% LLM，混合误差
    tradingagent: 0.40    # 纯 LLM 角色扮演，角色不一致 + prompt 敏感

  # 默认幻觉度（无辩论数据时的保守估计）
  default_h:
    lynx_vnpy: 0.0
    mindlynx: 0.15
    tradingagent: 0.30

  # sigmoid 映射陡度（越大曲线越陡）
  # v3.0: k=1.0 适配 [-3,+3] 宽范围（原 k=2.5 对应 [-1,+1]）
  probability_k: 1.0

  # 数学否决权配置
  override:
    ly_veto_threshold: 0.30   # |P_ly - 0.50| > 0.30 时触发否决权

schedule:
  run_time: "16:30"         # 每日收盘后运行
  timezone: "Asia/Shanghai"

wecom:
  # webhook_url 已迁移到项目根 .env（环境变量 WECOM_WEBHOOK_URL）
  # 代码中优先读取 env var，此处留空作为后备/占位
  webhook_url: ""
  enabled: true             # 企业微信推送已启用（需同时配置 .env 中的 WECOM_WEBHOOK_URL）

data_paths:
  lynx_root: "systems/lynx_vnpy"                     # lynx_vnpy 项目根目录
  mindlynx_reports: "systems/MindLynx-Aistock/reports/"  # MindLynx 报告目录
  tradingagent_logs: "~/.mind_tradingagent/logs/"     # TradingAgent 状态日志目录
  fusion_output: "data/fusion_output/"                # 融合结果输出

fusion_output:
  save_daily_csv: true      # 每日输出 CSV 格式融合结果
  save_daily_json: true     # 每日输出 JSON 格式融合结果
  history_retention_days: 90

logging:
  level: "INFO"
  retention_days: 90

# ═══════════════════════════════════════
# 统一数据缓存 (Unified Data Cache)
# ═══════════════════════════════════════
# SQLite 磁盘缓存，为三个子系统提供共享 OHLCV 数据层。
# 零侵入：各子系统无感知，缓存完全由融合引擎管理。
unified_cache:
  enabled: true                     # 是否启用统一缓存（关闭后直接调用 API）
  db_path: "data/unified_cache/ohlcv_cache.db"
  lynx_cache_enabled: true          # lynx_vnpy 是否使用缓存
  default_ttl: 86400               # 默认 TTL（秒），24 小时

  # 按数据类型配置 TTL 覆盖
  ttl_overrides:
    daily_ohlcv: 86400             # 日K线数据，24小时（次日交易日前有效）
    daily_ohlcv_intraday: 900      # 盘中日K线，15分钟（收盘前可刷新）
    realtime_quote: 900            # 实时行情，15分钟
    fundamentals: 604800           # 基本面数据，7天
    news: 3600                     # 新闻数据，1小时

  # 缓存预热：fusion 运行时自动从 MindLynx DB 和 TradingAgent CSV 导入
  auto_warm_from:
    mindlynx_db: "systems/MindLynx-Aistock/data/stock_analysis.db"
    tradingagent_cache_dir: "~/.mind_tradingagent/cache"

# ═══════════════════════════════════════
# 可选功能（每日融合推送时附带）
# ═══════════════════════════════════════
features:
  dragon_tiger:
    enabled: true             # 龙虎榜资金流向追踪
    top_n: 10                  # 龙虎榜前N只股票
  xueqiu:
    enabled: true              # 东方财富个股评级/关注度（非社交水军，机构数据）
    disabled_reason: "使用东方财富API，数据为机构评级，质量可靠"

backtest:
  enabled: true            # 回测功能已启用
  db_path: "data/backtest/bt_results.db"
  initial_weights:          # 回测使用的权重起始值（与 weights 保持一致即可）
    lynx_vnpy: 0.36
    mindlynx: 0.48
    tradingagent: 0.10
  weight_search_range:      # 网格搜索范围
    lynx_vnpy: [0.2, 0.3, 0.36, 0.4]
    mindlynx: [0.3, 0.4, 0.48, 0.55]
    tradingagent: [0.05, 0.10, 0.15, 0.20]
  report:
    weekly_cron: "30 17 * * 5"   # 每周五17:30推送周报
    accuracy_threshold: 0.50      # 基准准确率（低于此阈值告警）
