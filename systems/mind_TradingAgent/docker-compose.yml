services:
  mind-tradingagent:
    build: .
    env_file:
      - .env
    volumes:
      - mind_tradingagent_data:/home/appuser/.mind_tradingagent
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  mind-tradingagent-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - mind_tradingagent_data:/home/appuser/.mind_tradingagent
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  mind_tradingagent_data:
  ollama_data:
