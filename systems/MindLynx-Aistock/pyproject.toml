[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".git", "__pycache__", ".env", "venv", ".venv"]

[tool.bandit]
exclude_dirs = ["tests", "test_*.py"]
skips = ["B101"]

# =============================================
# Ruff — 现代 Python linter（替代 flake8+isort+bandit）
# =============================================
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
]
ignore = [
    "E501",
    "E402",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"__init__.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true

# =============================================
# mypy — 静态类型检查
# =============================================
[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
disallow_any_unimported = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests/*"
check_untyped_defs = false
disallow_untyped_defs = false
