instructions: |
  **默认多头趋势 — 基于道氏理论（Dow Theory）**

  适用场景：
  - 常规个股分析的默认策略。
  - 优先寻找"趋势向上 + 风险可控 + 不追高"的机会。

  ## 多周期趋势确认

  ### 1. 趋势方向（优先级最高）
  使用 `analyze_trend` 判断 MA5/MA10/MA20 排列：

  - **强势多头**：MA5 > MA10 > MA20 且均线发散上行，MA20斜率 > 0
  - **弱势多头**：MA5 > MA10 > MA20 但均线粘合，MA20斜率 ≈ 0
  - **横盘**：均线交织，无明确排列
  - **空头**：MA5 < MA10 < MA20 或 MA20斜率 < 0

  ### 2. 位置与节奏（关联理念1：严进策略）
  使用 `get_daily_history` 计算乖离率：

  - 乖离率 < 2%：最佳买点区间
  - 乖离率 2-5%：可小仓介入，注意等待回踩
  - 乖离率 > 5%：严禁追高！判定为"观望"
  - 价格跌破 MA20：降低看多权重

  ### 3. 量价验证（关联理念3：效率优先）
  使用 `get_daily_history` 检查量能：

  - 上涨日量比 > 1.2：量价配合良好
  - 上涨日量比 < 0.8：缩量上涨，需谨慎
  - 放量滞涨（量比 > 1.5 但收平/收跌）：潜在分歧

  ## 多头趋势买入条件（满足以下 3 项以上）

  - ✅ MA5 > MA10 > MA20（多头排列）
  - ✅ MA20 斜率向上（趋势确认）
  - ✅ 乖离率 < 5%（不追高）
  - ✅ 当日量比 > 1.0（量能正常）
  - ✅ 股价在 MA20 之上（趋势健康）
  - ✅ 无重大利空（风险排查通过）

  ## 多头趋势卖出条件（满足以下 2 项以上）

  - ⚠️ 跌破 MA20（趋势转弱）
  - ⚠️ MA5 下穿 MA10（短线转弱）
  - ⚠️ 连续 3 日缩量上涨（动能衰竭）
  - ⚠️ 乖离率 > 8%（超买风险）
  - ⚠️ 重大利空出现

  ## 交易建议输出
  - 输出明确的"买入/观望/减仓"倾向及触发条件。
  - 必须给出止损参考（如 MA20 下方或结构低点）。
  - 若无清晰优势，明确写"暂不出手"，避免过度交易。

  评分调整建议：
  - 多头排列 + 趋势强度良好：`sentiment_score +12`
  - 回踩关键均线后企稳：`sentiment_score +8`
  - 放量突破关键阻力：`sentiment_score +10`
  - 跌破 MA20 或趋势转弱：`sentiment_score -12`
  - 买入条件满足 5 项以上：额外 `+5`
