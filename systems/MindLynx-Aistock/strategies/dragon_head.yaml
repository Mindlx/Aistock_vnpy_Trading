instructions: |
  **龙头策略 — 基于欧奈尔CANSLIM（William O'Neil）**

  核心逻辑：在板块轮动中识别最强个股，只做"领头羊"，不做"跟风股"。

  ## 评估框架

  ### 1. 板块地位确认
  使用 `get_sector_rankings` 检查：

  - 该股所在板块是否在近 5 日涨幅前 5 名？
  - 板块内是否有 3 只以上个股同步走强？（板块效应）
  - 个股是否在板块启动周期中率先上涨或涨停？（领涨地位）

  ### 2. 相对强度量化（关联理念7：强势趋势股放宽）
  使用 `get_realtime_quote` 和 `analyze_trend`：

  - **量比 > 1.5**：有活跃的交易兴趣
  - **换手率 3-8%**：正常龙头活跃度
  - **换手率 > 10%**：过热，警惕分歧
  - **个股涨幅 > 板块平均涨幅 2% 以上**：真正的领涨
  - **回调不破 MA5**：强势整理
  - 龙头股可放宽乖离率至 7%，但超过 10% 仍需谨慎

  ### 3. 新闻催化验证
  使用 `search_stock_news`：

  - 是否有板块级催化剂？（政策、事件、产品、业绩）
  - 个股是否有独特逻辑支撑其龙头地位？（技术壁垒、市占率、订单）
  - 无催化剂纯资金博弈的龙头 → 降低仓位

  ## 龙头确认条件（满足 4 项以上）

  - ✅ 所在板块近 5 日涨幅前 5
  - ✅ 板块内有 3+ 只个股同步走强
  - ✅ 个股率先涨停/领涨（相对强度高）
  - ✅ 量比 > 1.5（资金活跃）
  - ✅ 有明确催化逻辑
  - ✅ 乖离率 < 7%（可放宽但不失控）

  ## 龙头退出条件（满足任意 2 项）

  - ⚠️ 板块排名退至前 10 以外
  - ⚠️ 放量滞涨或高开低走
  - ⚠️ 个股不再领涨（被板块内其他股超越）
  - ⚠️ 换手率 > 15%（极度过热）
  - ⚠️ 利空/澄清公告

  ## 仓位管理

  - 确认龙头 + 板块启动初期：可 3-4 成
  - 龙头分化期：减至 1-2 成
  - 纯概念、无催化龙头：最多 1 成
  - 止损设在 MA10 或涨停板开盘价下方 3%

  评分调整建议：
  - 确认为龙头股（满足 4+ 项）：`sentiment_score +12`
  - 板块正处于主动轮动期：额外 `+5`
  - 龙头上位初期（首次领涨）：额外 `+5`
  - 龙头分化、不再领涨：`sentiment_score -8`
  - 极度过热（换手 > 15%）：`sentiment_score -10`
  - 在 `buy_reason` 中注明"龙头策略"及满足条件数量。
