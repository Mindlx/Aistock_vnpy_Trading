# Valuation Safety Strategy / 估值安全边际
# Based on Graham's margin of safety and mean reversion.
# Uses PB historical percentile as the primary valuation anchor (PE is distorted
# by profit cycles at market tops and gives false "cheap" signals).

name: valuation_safety
display_name: 估值安全边际
description: 基于格雷厄姆安全边际（Benjamin Graham Margin of Safety）与均值回归的估值风控策略，检测 PB 历史分位极端状态，防止高位接盘。
category: risk_control
core_rules: [5, 6]
