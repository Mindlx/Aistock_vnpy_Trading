instructions: |
  **热点题材 — 基于索罗斯反身性 + 社会心理学**

  核心逻辑：政策/产业热点 → 资金涌入 → 价格自我强化 → 情绪过热 → 反身性拐点。
  在热点启动期介入，在狂热期退出。

  ## 热点生命周期量化判断

  ### 第一阶段：启动期（最佳介入窗口）
  使用 `get_sector_rankings` 和 `search_stock_news`：

  - 板块近 3 日涨幅进入前 10
  - 板块成交额较前 5 日放大 > 50%
  - 出现明确的政策/事件/产业催化
  - 板块内 2-3 只个股涨停或放量大涨
  - **量比 > 1.5**：资金开始进入

  ### 第二阶段：扩散期（可持有/加仓）
  - 板块排名进入前 3
  - 板块内涨停/大涨个股扩散至 5+ 只
  - 催化逻辑被主流媒体/机构认可
  - 龙头股换手率 5-10%，量价配合良好
  - 跟风股开始出现（市场情绪升温）

  ### 第三阶段：分化期（减仓）
  - 板块内部分个股开始掉队
  - 龙头股放量滞涨或高换手（>12%）不涨
  - 新闻以"涨停复盘""龙虎榜""资金追捧"为主
  - 非核心股开始大幅回调
  - 乖离率 > 8% 的个股增多

  ### 第四阶段：退潮期（离场）
  - 板块排名跌出前 10
  - 多只个股出现亏钱效应（炸板、冲高回落）
  - 无明显新增催化
  - 成交量萎缩至高峰期 50% 以下
  - 出现监管问询/政策降温信号

  ## 热点介入条件（必须同时满足）

  - ✅ 热点处于启动期或扩散早期
  - ✅ 个股与热点有直接业务/业绩关联（非概念炒作）
  - ✅ 个股量比 > 1.5，换手率 3-8%（健康放量）
  - ✅ 乖离率 < 5%（不追高）
  - ✅ 无重大利空（减持、监管、业绩预警）

  ## 热点退出条件（满足任意 2 项）

  - ⚠️ 热点进入分化或退潮期
  - ⚠️ 个股放量滞涨或高开低走
  - ⚠️ 换手率 > 15%（极度过热）
  - ⚠️ 监管问询/澄清公告/减持
  - ⚠️ 板块排名跌出前 10

  ## 输出要求

  - 明确当前热点阶段：启动 / 扩散 / 分化 / 退潮
  - 说明个股与热点的实质相关性（直接受益/间接受益/概念关联）
  - 给出满足/不满足的介入条件数量
  - 明确止损位（关键支撑或热点逻辑证伪）

  评分调整建议：
  - 热点处于启动/扩散期，个股实质受益：`sentiment_score +12`
  - 个股强于板块并有量能确认：额外 `+6`
  - 热点进入分化期：`sentiment_score -8`
  - 热点退潮期：`sentiment_score -15`
  - 纯概念蹭热点且乖离率过高：`sentiment_score -12`
  - 介入条件全部满足：额外 `+5`
