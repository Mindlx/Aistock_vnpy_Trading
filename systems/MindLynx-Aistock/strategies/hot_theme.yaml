# Hot Theme Strategy / 热点题材
# Based on Soros Reflexivity and social psychology.

name: hot_theme
display_name: 热点题材
description: 基于索罗斯反身性理论（Soros Reflexivity）与社会心理学框架的热点题材追踪策略。
